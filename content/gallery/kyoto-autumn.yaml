slug: kyoto-autumn
title: 京都秋行
date: "2025-11-12"
cover: /gallery/kyoto-autumn/01.jpg
summary: 深秋的京都，从东福寺通天桥到岚山竹林的一日步行，红叶与古寺的光影。
photos:
  - src: /gallery/kyoto-autumn/01.jpg
    width: 1536
    height: 1024
    alt: 深秋木桥栏杆外层叠的红褐色枫林与寺院屋顶
    caption: 秋桥枫谷
    note: 木栏向谷底延伸，暮秋的颜色在阴天里安静下来。
  - src: /gallery/kyoto-autumn/02.jpg
    width: 1024
    height: 1536
    alt: 高耸竹林间铺满落叶并转入深处的窄路
    caption: 竹林深处
    note: 竹影收住了天光，脚下只剩落叶与泥土的颜色。
  - src: /gallery/kyoto-autumn/03.jpg
    width: 1536
    height: 1024
    alt: 深秋枫树与木构寺院倒映在静谧池水中
    caption: 寺院池影
    note: 风停了一刻，屋檐与枫色在水面重新排列。
  - src: /gallery/kyoto-autumn/04.jpg
    width: 1254
    height: 1254
    alt: 雨后长着青苔的旧石径散落着红褐色枫叶
    caption: 雨后石径
    note: 潮湿的石面压低了颜色，也让每一片落叶更清楚。
  - src: /gallery/kyoto-autumn/05.jpg
    width: 1122
    height: 1402
    alt: 枫枝掩映下延伸向暗处的古寺木廊与纸门
    caption: 木廊暮秋
    note: 回廊里没有人，木柱把下午的光分成缓慢的段落。
  - src: /gallery/kyoto-autumn/06.jpg
    width: 1254
    height: 1254
    alt: 竹制水口向覆满青苔与落叶的石钵滴水
    caption: 庭中水声
    note: 水滴落进石钵，庭院里最小的声音反而留得最久。
  - src: /gallery/kyoto-autumn/07.jpg
    width: 1536
    height: 1024
    alt: 黄昏河岸望向木桥、秋树与层叠远山
    caption: 渡月桥暮色
    note: 离开前的最后一帧，灯刚亮起，山色已经沉下去。
